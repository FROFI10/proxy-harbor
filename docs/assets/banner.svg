<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Proxy Harbor</title>
  <desc id="desc">Local verified HTTP, SOCKS4 and SOCKS5 proxy pool with a web dashboard and API.</desc>
  <rect width="1200" height="280" rx="16" fill="#171815"/>
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="#35392f"/>
  <rect x="42" y="42" width="52" height="52" rx="10" fill="#a3d9ba"/>
  <text x="68" y="76" text-anchor="middle" fill="#171815" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">PH</text>
  <text x="112" y="63" fill="#a4ab9c" font-family="Consolas,monospace" font-size="13" letter-spacing="2">LOCAL PROXY SERVICE</text>
  <text x="40" y="162" fill="#e6e8df" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Proxy Harbor</text>
  <text x="44" y="202" fill="#a4ab9c" font-family="Segoe UI,Arial,sans-serif" font-size="20">Public proxies. Verified locally. Served over localhost.</text>
  <line x1="44" y1="236" x2="1156" y2="236" stroke="#35392f"/>
  <text x="44" y="260" fill="#a3d9ba" font-family="Consolas,monospace" font-size="14">HTTP · SOCKS4 · SOCKS5</text>
  <text x="1156" y="260" text-anchor="end" fill="#a4ab9c" font-family="Consolas,monospace" font-size="14">FastAPI / SQLite / Web UI</text>
  <rect x="855" y="53" width="300" height="129" rx="10" fill="#1e201c" stroke="#35392f"/>
  <text x="877" y="85" fill="#a4ab9c" font-family="Consolas,monospace" font-size="13">GET /api/proxy</text>
  <text x="877" y="116" fill="#a3d9ba" font-family="Consolas,monospace" font-size="13">fresh + verified only</text>
  <text x="877" y="147" fill="#e6e8df" font-family="Consolas,monospace" font-size="13">127.0.0.1:8765</text>
</svg>
